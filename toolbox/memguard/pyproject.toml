[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "memguard"
version = "0.1.0"
description = "Machine-wide memory gate for local model loading: ctypes memory probe, lease broker with one ledger per machine, and preflight."
requires-python = ">=3.9"
dependencies = []

[project.scripts]
memguard-preflight = "memguard.cli:main_preflight"
memguard-demo = "memguard.cli:main_demo"

[tool.setuptools]
packages = ["memguard"]
